<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Leitos & Etiquetas CMI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .pulsing-dot { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-700 p-2.5 rounded-lg">
                    <i class="fa-solid fa-bed-pulse text-2xl text-indigo-200"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Painel de Leitos & Etiquetas CMI</h1>
                    <p class="text-xs text-indigo-300">Pacientes internados nas Unidades CMI (tempo real via Oracle)</p>
                </div>
            </div>

            <!-- Polling Indicator -->
            <div class="flex items-center space-x-4 bg-indigo-950/60 px-4 py-2 rounded-xl border border-indigo-700/50">
                <div class="flex items-center space-x-2">
                    <span id="status-pulse" class="w-3 h-3 bg-green-500 rounded-full pulsing-dot"></span>
                    <span id="status-texto" class="text-xs font-semibold text-green-400">TEMPO REAL ATIVO</span>
                </div>
                <div class="text-xs text-gray-300 border-l border-indigo-700 pl-3">
                    Fonte: <span id="label-fonte" class="font-mono text-indigo-200">--</span>
                </div>
                <div class="text-xs text-gray-300 border-l border-indigo-700 pl-3">
                    Sincronizado: <span id="label-ultima-atualizacao" class="font-mono text-indigo-200">--:--:--</span>
                </div>
                <button onclick="buscarDadosAPI()" class="bg-indigo-800 hover:bg-indigo-700 p-1.5 rounded-lg text-xs"><i class="fa-solid fa-rotate"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Metricas -->
        <section class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <p class="text-xs font-medium text-gray-500 uppercase">Total de Pacientes CMI</p>
                <h3 id="stat-total" class="text-2xl font-bold text-gray-800">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-emerald-200">
                <p class="text-xs font-medium text-emerald-600 uppercase">Pacientes Reais Exibidos</p>
                <h3 id="stat-ocupados" class="text-2xl font-bold text-emerald-700">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-200">
                <p class="text-xs font-medium text-indigo-600 uppercase">Unidades (setores)</p>
                <h3 id="stat-setores" class="text-2xl font-bold text-indigo-700">0</h3>
            </div>
        </section>

        <!-- Filtros de Pesquisa -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                <h2 class="text-base font-semibold text-gray-800"><i class="fa-solid fa-sliders text-indigo-600 mr-2"></i>Filtros de Visualizacao</h2>
                <div class="flex gap-2">
                    <button onclick="imprimirNavegador()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-print"></i> Imprimir Selecionados (<span id="count-impressao">0</span>)
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-gray-100">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Buscar Paciente / Atendimento / Unidade</label>
                    <input type="text" id="filtro-busca" oninput="aplicarFiltros()" placeholder="Nome, atendimento, unidade..." class="w-full px-3 py-1.5 text-xs rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Unidade (ds_unid_int)</label>
                    <select id="filtro-setor" onchange="aplicarFiltros()" class="w-full py-1.5 px-2.5 text-xs rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="TODOS">Todas as Unidades</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Grid de Pacientes -->
        <section>
            <div id="grid-leitos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>
    </main>

    <script>
        let dadosBrutos = [];
        let selecionados = new Set();

        async function buscarDadosAPI() {
            try {
                const res = await fetch('/api/leitos');
                const data = await res.json();
                dadosBrutos = (data.dados || []).filter(x => x.eh_real);
                document.getElementById('label-ultima-atualizacao').innerText = new Date().toLocaleTimeString('pt-BR');
                document.getElementById('label-fonte').innerText = (data.fonte || '--').toUpperCase();
                atualizarOpcoesSetor();
                aplicarFiltros();
            } catch (err) {
                console.error('Erro ao conectar na API:', err);
            }
        }

        function atualizarOpcoesSetor() {
            const select = document.getElementById('filtro-setor');
            const atual = select.value;
            const setores = [...new Set(dadosBrutos.map(x => x.setor).filter(Boolean))].sort();
            select.innerHTML = '<option value="TODOS">Todas as Unidades</option>' +
                setores.map(s => `<option value="${s}">${s}</option>`).join('');
            select.value = setores.includes(atual) ? atual : 'TODOS';
        }

        function aplicarFiltros() {
            const busca = document.getElementById('filtro-busca').value.toLowerCase().trim();
            const setor = document.getElementById('filtro-setor').value;

            const setoresUnicos = new Set(dadosBrutos.map(x => x.setor).filter(Boolean));

            document.getElementById('stat-total').innerText = dadosBrutos.length;
            document.getElementById('stat-ocupados').innerText = dadosBrutos.length;
            document.getElementById('stat-setores').innerText = setoresUnicos.size;

            const filtrados = dadosBrutos.filter(item => {
                if (setor !== 'TODOS' && item.setor !== setor) return false;
                if (busca) {
                    const txt = `${item.nome_paciente} ${item.cd_atendimento} ${item.cd_paciente} ${item.setor}`.toLowerCase();
                    if (!txt.includes(busca)) return false;
                }
                return true;
            });

            renderizarGrid(filtrados);
        }

        function renderizarGrid(lista) {
            const container = document.getElementById('grid-leitos');
            if (lista.length === 0) {
                container.innerHTML = `<div class="col-span-full bg-white p-8 text-center rounded-xl text-gray-500">Nenhum paciente encontrado nas Unidades CMI.</div>`;
                return;
            }

            container.innerHTML = lista.map(item => `
                <div class="bg-white rounded-xl p-4 border border-indigo-100 shadow-sm space-y-3">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" onchange="toggleSelecao(${item.id})" ${selecionados.has(item.id) ? 'checked' : ''} class="w-4 h-4 text-indigo-600 rounded">
                            <span class="text-[10px] text-gray-500 font-bold">${item.setor}</span>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">
                            INTERNADO
                        </span>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-gray-900">${item.nome_paciente}</h4>
                        <div class="grid grid-cols-2 gap-1 text-xs text-gray-600 mt-2">
                            <div><b>Atend:</b> #${item.cd_atendimento}</div>
                            <div><b>Cod. Paciente:</b> ${item.cd_paciente}</div>
                            <div class="col-span-2"><b>Unidade (cd_unid_int):</b> ${item.cd_unid_int}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('count-impressao').innerText = selecionados.size;
        }

        function toggleSelecao(id) {
            if (selecionados.has(id)) selecionados.delete(id);
            else selecionados.add(id);
            document.getElementById('count-impressao').innerText = selecionados.size;
        }

        function imprimirNavegador() {
            const selecionadosLista = dadosBrutos.filter(x => selecionados.has(x.id));
            if (selecionadosLista.length === 0) return alert('Selecione ao menos um paciente.');

            sessionStorage.setItem('etiquetas_impressao', JSON.stringify(selecionadosLista));
            window.open('imprimir.html', '_blank');
        }

        window.onload = () => {
            buscarDadosAPI();
            setInterval(buscarDadosAPI, 10000);
        };
    </script>
</body>
</html>
