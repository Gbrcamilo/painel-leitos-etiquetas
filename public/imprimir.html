<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Impressão de Etiquetas - CMI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @media print {
            body { margin: 0; padding: 0; }
            .etiqueta {
                page-break-after: always;
                width: 100mm;
                height: 50mm;
                padding: 3mm;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
                border: 1px solid #000;
            }
        }
        .etiqueta {
            width: 100mm;
            height: 50mm;
            padding: 3mm;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            border: 1px solid #000;
            margin: 10px auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div id="container-etiquetas"></div>

    <script>
        window.onload = () => {
            const raw = sessionStorage.getItem('etiquetas_impressao');
            if (!raw) return alert('Nenhuma etiqueta selecionada.');

            const pacientes = JSON.parse(raw);
            const container = document.getElementById('container-etiquetas');

            pacientes.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'etiqueta';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; border-bottom:1px solid #000; padding-bottom:2px;">
                        <b style="font-size:11px;">HOSPITAL CMI</b>
                        <b style="font-size:12px; background:#000; color:#fff; padding:1px 4px;">${item.leito}</b>
                    </div>
                    <div style="font-size:10px; font-weight:bold; text-transform:uppercase;">${item.setor}</div>
                    <div style="font-size:13px; font-weight:900; text-transform:uppercase;">${item.nome_paciente}</div>
                    <div style="font-size:10px; display:flex; justify-content:space-between;">
                        <span><b>ATEND:</b> #${item.cd_atendimento}</span>
                        <span><b>DIETA:</b> ${item.dieta || 'GERAL'}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:flex-end; border-top:1px solid #000; pt:2px;">
                        <div id="qr-${index}"></div>
                        <div style="font-size:8px; font-family:monospace; text-align:right;">
                            <div>EMISSÃO: ${new Date().toLocaleString('pt-BR')}</div>
                            <div>PACIENTE ATIVO REAL</div>
                        </div>
                    </div>
                `;
                container.appendChild(div);

                new QRCode(div.querySelector(`#qr-${index}`), {
                    text: `CMI|ATEND:${item.cd_atendimento}|LEITO:${item.leito}`,
                    width: 32,
                    height: 32
                });
            });

            setTimeout(() => { window.print(); }, 500);
        };
    </script>
</body>
</html>
